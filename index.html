<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kim Cương Spa</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fdf8f5;
            color: #333333;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            max-width: 480px;
            width: 100%;
            padding: 32px 24px;
            text-align: center;
        }
        .logo-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        h1 {
            color: #8b5cf6;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .tagline {
            font-size: 16px;
            color: #666666;
            margin-bottom: 24px;
        }
        .address {
            background-color: #f5f3ff;
            border-radius: 8px;
            padding: 16px;
            font-size: 14px;
            color: #4c1d95;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .btn-hotline {
            display: inline-block;
            width: 100%;
            background-color: #8b5cf6;
            color: #ffffff;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            padding: 14px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
            transition: background-color 0.2s ease;
        }
        .btn-hotline:hover, .btn-hotline:active {
            background-color: #7c3aed;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-icon">💎</div>
        <h1>Kim Cương Spa</h1>
        <p class="tagline">Nơi thư giãn và chăm sóc vẻ đẹp tự nhiên hàng đầu cho bạn.</p>
        <p class="address">📍 441 Đại lộ Bình Dương, Phú Cường, Thủ Dầu Một, Bình Dương</p>
        <a href="tel:0900000000" class="btn-hotline">📞 Gọi Hotline ngay</a>
    </div>
</body>
</html>
